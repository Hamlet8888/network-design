!==============================================================================
! DC2-NXSP-01 · Spine / EVPN route server · BGP AS 65220
! DC1-DC2 EVPN/VXLAN Multi-Site demo fabric (BGP only). Generated by fabric_design.
! FICTIONAL DEMO DATA: not for any real network.
! Template: validate against the exact Nexus model and NX-OS release before use.
! Fill in every <placeholder>. Host-gateway SVIs ship shut (migration step M3).
! Baseline included: AAA/TACACS+, NTP, syslog, SNMPv3, CoPP, SSH-only vty, banner.
!==============================================================================

hostname DC2-NXSP-01

! ---- out-of-band management (10.120.245.0/24, gateway on the firewall) ---
vrf context management
  ip route 0.0.0.0/0 10.120.245.1
  ip name-server 10.250.0.53
  ip name-server 10.250.1.53
  ip domain-name dc.example.net
interface mgmt0
  vrf member management
  ip address 10.120.245.11/24

! ---- baseline: hardening -------------------------------------------
no feature telnet
feature ssh
password strength-check
copp profile strict

ip access-list ACL-VTY
  10 permit tcp 10.110.245.0/24 any eq 22
  20 permit tcp 10.120.245.0/24 any eq 22
  30 permit tcp 10.250.0.0/23 any eq 22
  1000 deny ip any any log
line console
  exec-timeout 10
line vty
  exec-timeout 10
  access-class ACL-VTY in

! ---- baseline: AAA (TACACS+, local fallback when no server answers) -----
feature tacacs+
tacacs-server host 10.250.0.49 key 7 <TACACS-KEY-TYPE7>
tacacs-server host 10.250.1.49 key 7 <TACACS-KEY-TYPE7>
aaa group server tacacs+ TACACS
  server 10.250.0.49
  server 10.250.1.49
  use-vrf management
  source-interface mgmt0
aaa authentication login default group TACACS
aaa authentication login console local
aaa authorization commands default group TACACS local
aaa accounting default group TACACS
aaa authentication login error-enable
username admin password 5 <LOCAL-ADMIN-HASH> role network-admin

! ---- baseline: time, logging, SNMPv3 ----------------------------------
clock timezone UTC 0 0
ntp server 10.250.0.123 use-vrf management prefer
ntp server 10.250.1.123 use-vrf management
ntp source-interface mgmt0

logging server 10.250.0.40 5 use-vrf management
logging source-interface mgmt0
logging timestamp milliseconds

snmp-server contact noc@example.net
snmp-server location DC2 Example colo, Example City B
snmp-server user nms-ro network-operator auth sha <SNMP-AUTH-KEY> priv aes-128 <SNMP-PRIV-KEY>
snmp-server host 10.250.0.162 traps version 3 priv nms-ro
snmp-server host 10.250.0.162 use-vrf management
snmp-server source-interface traps mgmt0
snmp-server enable traps bgp

banner motd ^
Authorized access only. Activity is logged and monitored.
Disconnect now if you are not an authorized user.
^

nv overlay evpn
feature bgp
feature bfd

route-map RM-NH-UNCHANGED permit 10
  set ip next-hop unchanged

interface loopback0
  description Router-ID / EVPN peering
  ip address 10.120.240.1/32

interface Ethernet1/1
  description DC2-NXLF-01 Eth1/49
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.0/31
  no shutdown

interface Ethernet1/2
  description DC2-NXLF-02 Eth1/49
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.2/31
  no shutdown

interface Ethernet1/3
  description DC2-NXLF-03 Eth1/49
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.4/31
  no shutdown

interface Ethernet1/4
  description DC2-NXLF-04 Eth1/49
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.6/31
  no shutdown

interface Ethernet1/5
  description DC2-NXBGW-01 Eth1/49
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.8/31
  no shutdown

interface Ethernet1/6
  description DC2-NXBGW-02 Eth1/49
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.10/31
  no shutdown

router bgp 65220
  router-id 10.120.240.1
  bestpath as-path multipath-relax
  address-family ipv4 unicast
    network 10.120.240.1/32
    maximum-paths 8
  address-family l2vpn evpn
    retain route-target all          ! no VRFs here; keep every EVPN route to pass on
  neighbor 10.120.242.1
    remote-as 65221
    description DC2-NXLF-01 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.242.3
    remote-as 65222
    description DC2-NXLF-02 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.242.5
    remote-as 65223
    description DC2-NXLF-03 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.242.7
    remote-as 65224
    description DC2-NXLF-04 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.242.9
    remote-as 65225
    description DC2-NXBGW-01 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.242.11
    remote-as 65226
    description DC2-NXBGW-02 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.240.11
    remote-as 65221
    description DC2-NXLF-01 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map RM-NH-UNCHANGED out   ! next hop stays the originating VTEP
  neighbor 10.120.240.12
    remote-as 65222
