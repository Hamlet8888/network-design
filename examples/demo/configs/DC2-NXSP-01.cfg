      send-community
      send-community extended
      route-map RM-NH-UNCHANGED out   ! next hop stays the originating VTEP
  neighbor 10.120.240.14
    remote-as 65224
    description DC2-NXLF-04 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map RM-NH-UNCHANGED out   ! next hop stays the originating VTEP
  neighbor 10.120.240.21
    remote-as 65225
    description DC2-NXBGW-01 EVPN
    update-source loopback0
    ebgp-multihop 2
