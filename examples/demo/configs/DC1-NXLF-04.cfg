!==============================================================================
! DC1-NXLF-04 · Border-service leaf / VTEP · BGP AS 65214
! DC1-DC2 EVPN/VXLAN Multi-Site demo fabric (BGP only). Generated by fabric_design.
! FICTIONAL DEMO DATA: not for any real network.
! Template: validate against the exact Nexus model and NX-OS release before use.
! Fill in every <placeholder>. Host-gateway SVIs ship shut (migration step M3).
! Baseline included: AAA/TACACS+, NTP, syslog, SNMPv3, CoPP, SSH-only vty, banner.
!==============================================================================

hostname DC1-NXLF-04

! ---- out-of-band management (10.110.245.0/24, gateway on the firewall) ---
vrf context management
  ip route 0.0.0.0/0 10.110.245.1
  ip name-server 10.250.0.53
  ip name-server 10.250.1.53
  ip domain-name dc.example.net
interface mgmt0
  vrf member management
  ip address 10.110.245.24/24

! ---- baseline: hardening -------------------------------------------
no feature telnet
feature ssh
password strength-check
copp profile strict

ip access-list ACL-VTY
  10 permit tcp 10.110.245.0/24 any eq 22
  20 permit tcp 10.120.245.0/24 any eq 22
  30 permit tcp 10.250.0.0/23 any eq 22
  1000 deny ip any any log
line console
  exec-timeout 10
line vty
  exec-timeout 10
  access-class ACL-VTY in

! ---- baseline: AAA (TACACS+, local fallback when no server answers) -----
feature tacacs+
tacacs-server host 10.250.0.49 key 7 <TACACS-KEY-TYPE7>
tacacs-server host 10.250.1.49 key 7 <TACACS-KEY-TYPE7>
aaa group server tacacs+ TACACS
  server 10.250.0.49
  server 10.250.1.49
  use-vrf management
  source-interface mgmt0
aaa authentication login default group TACACS
aaa authentication login console local
aaa authorization commands default group TACACS local
aaa accounting default group TACACS
aaa authentication login error-enable
username admin password 5 <LOCAL-ADMIN-HASH> role network-admin

! ---- baseline: time, logging, SNMPv3 ----------------------------------
clock timezone UTC 0 0
ntp server 10.250.0.123 use-vrf management prefer
ntp server 10.250.1.123 use-vrf management
ntp source-interface mgmt0

logging server 10.250.0.40 5 use-vrf management
logging source-interface mgmt0
logging timestamp milliseconds

snmp-server contact noc@example.net
snmp-server location DC1 Example colo, Example City A
snmp-server user nms-ro network-operator auth sha <SNMP-AUTH-KEY> priv aes-128 <SNMP-PRIV-KEY>
snmp-server host 10.250.0.162 traps version 3 priv nms-ro
snmp-server host 10.250.0.162 use-vrf management
snmp-server source-interface traps mgmt0
snmp-server enable traps bgp

banner motd ^
Authorized access only. Activity is logged and monitored.
Disconnect now if you are not an authorized user.
^

nv overlay evpn
feature bgp
feature bfd
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
feature vpc
feature lacp
fabric forwarding anycast-gateway-mac 2020.0000.00aa

! ---- underlay (eBGP, AS 65214) ---------------------------------------
interface loopback0
  description Router-ID / EVPN peering
  ip address 10.110.240.14/32

interface loopback1
  description VTEP (primary) + vPC anycast VTEP (secondary)
  ip address 10.110.241.14/32
  ip address 10.110.241.102/32 secondary

interface Ethernet1/49
  description DC1-NXSP-01 Eth1/4
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.110.242.7/31
  no shutdown

interface Ethernet1/50
  description DC1-NXSP-02 Eth1/4
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.110.242.39/31
  no shutdown

! ---- vPC ---------------------------------------------------------------
vrf context KEEPALIVE

interface Ethernet1/48
  description vPC keepalive to DC1-NXLF-03
  no switchport
  vrf member KEEPALIVE
  ip address 10.110.243.10/30
  no shutdown

spanning-tree vlan 1-3967 priority 8192

vpc domain 112
  peer-switch
  role priority 20
  peer-keepalive destination 10.110.243.9 source 10.110.243.10 vrf KEEPALIVE
  peer-gateway
  ip arp synchronize

interface port-channel10
  description vPC peer-link to DC1-NXLF-03
  switchport mode trunk
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/53-54
  description vPC peer-link
  switchport mode trunk
  channel-group 10 mode active
  no shutdown

vlan 3900
  name VPC-BACKUP-UNDERLAY
system nve infra-vlans 3900

interface Vlan3900
  description vPC backup underlay to DC1-NXLF-03 (eBGP)
  no shutdown
  mtu 9216
  no ip redirects
  ip address 10.110.243.14/30

! ---- tenant VRF and L3VNI ---------------------------------------------
vrf context TRUST
  vni 50010
  rd auto
  address-family ipv4 unicast
    route-target both 65000:50010
    route-target both 65000:50010 evpn

vlan 3910
  name L3VNI-TRUST
  vn-segment 50010

interface Vlan3910
  description L3VNI TRUST
  no shutdown
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip forward

! ---- host VLANs: same VLAN ID, subnet and .1 gateway as today ----------
! Every routed VLAN from section 6.1. Prune to the VLANs whose hosts attach to this pair.

vlan 10
  name MGMT
  vn-segment 110010
vlan 20
  name SERVERS-20
  vn-segment 110020
vlan 30
  name APP-30
  vn-segment 110030
vlan 40
  name DB-40
  vn-segment 110040
vlan 100
  name STORAGE-100
  vn-segment 110100

interface Vlan10
  description MGMT (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (M3)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.110.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan20
  description SERVERS-20 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (M3)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.110.20.1/24
  fabric forwarding mode anycast-gateway

interface Vlan30
  description APP-30 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (M3)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.110.30.1/24
  fabric forwarding mode anycast-gateway

interface Vlan40
  description DB-40 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (M3)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.110.40.1/24
  fabric forwarding mode anycast-gateway

interface Vlan100
  description STORAGE-100 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (M3)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.110.100.1/24
  fabric forwarding mode anycast-gateway

! Explicit RTs: with a different ASN per leaf, 'auto' would give every leaf a different RT.
evpn
  vni 110010 l2
    rd auto
    route-target import 65110:110010
    route-target export 65110:110010
  vni 110020 l2
    rd auto
    route-target import 65110:110020
    route-target export 65110:110020
  vni 110030 l2
    rd auto
    route-target import 65110:110030
    route-target export 65110:110030
  vni 110040 l2
    rd auto
    route-target import 65110:110040
    route-target export 65110:110040
  vni 110100 l2
    rd auto
    route-target import 65110:110100
    route-target export 65110:110100

! ARP suppression needs TCAM space on -EX/-FX platforms first (then reload):
!   hardware access-list tcam region arp-ether 256 double-wide
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  advertise virtual-rmac
  global ingress-replication protocol bgp
  global suppress-arp
  member vni 50010 associate-vrf
  member vni 110010
  member vni 110020
  member vni 110030
  member vni 110040
  member vni 110100

! ---- BGP: underlay + overlay ------------------------------------------
ip prefix-list PL-DC1-SITE seq 10 permit 10.110.0.0/16 le 32
route-map RM-DIRECT permit 10
  match ip address prefix-list PL-DC1-SITE

router bgp 65214
  router-id 10.110.240.14
  bestpath as-path multipath-relax
  address-family ipv4 unicast
    network 10.110.240.14/32
    network 10.110.241.14/32
    network 10.110.241.102/32
    maximum-paths 4
  address-family l2vpn evpn
    advertise-pip
  neighbor 10.110.242.6
    remote-as 65210
    description DC1-NXSP-01 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.110.242.38
    remote-as 65210
    description DC1-NXSP-02 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.110.243.13
    remote-as 65213
    description DC1-NXLF-03 vPC backup underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.110.240.1
    remote-as 65210
    description DC1-NXSP-01 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.110.240.2
    remote-as 65210
    description DC1-NXSP-02 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
  vrf TRUST
    address-family ipv4 unicast
      redistribute direct route-map RM-DIRECT
      maximum-paths 4

! ---- border-service: firewall handoff (eBGP, VRF TRUST) ---------
! Routed transit, no ae8 and no vPC to the firewall. FW-01 and FW-02 share the HA-synced
! address, so both firewalls' ports sit in one local VLAN; only the active one forwards.
vlan 3012
  name FW-TRANSIT-LF-04

interface Vlan3012
  description Firewall transit 10.110.244.72/29 (DC1-FW-01/02 ethernet1/26)
  no shutdown
  vrf member TRUST
  no ip redirects
  ip address 10.110.244.74/29          ! firewall 10.110.244.73

interface Ethernet1/45
  description DC1-FW-01 ethernet1/26
  switchport mode access
  switchport access vlan 3012
  spanning-tree port type edge
  no shutdown
interface Ethernet1/46
  description DC1-FW-02 ethernet1/26
  switchport mode access
  switchport access vlan 3012
  spanning-tree port type edge
  no shutdown

interface port-channel10
  switchport trunk allowed vlan remove 3012   ! local VLAN: keep it off the vPC peer-link

ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list PL-DC2-SITE seq 10 permit 10.120.0.0/16 le 32

route-map RM-FW-IN permit 10          ! the firewall sends only the default route
  match ip address prefix-list PL-DEFAULT
route-map RM-FW-OUT permit 10         ! both sites' specifics (beat the firewall's IPsec statics)
  match ip address prefix-list PL-DC1-SITE PL-DC2-SITE

! ---- migration only (M2 until M6): eBGP to the legacy core over VLAN 99 -
! The legacy core must run BGP (AS 65218) for the migration window and
! redistribute its connected/OSPF routes into it. Remove this block at M6.
vlan 99
  name LEGACY-CORE-10.110.99.0

interface Vlan99
  description Legacy core transit (migration)
  no shutdown
  vrf member TRUST
  no ip redirects
  ip address 10.110.99.12/24              ! confirm free in 10.110.99.0/24

interface port-channel30
  description Legacy core DC1-CORE-01/02 (migration)
  switchport mode trunk
  switchport trunk allowed vlan 99
  spanning-tree port type normal
  vpc 30
  shutdown
interface Ethernet1/43
  description Legacy core switch 01 (migration)
  switchport mode trunk
  switchport trunk allowed vlan 99
  channel-group 30 mode active
  shutdown
interface Ethernet1/44
  description Legacy core switch 02 (migration)
  switchport mode trunk
  switchport trunk allowed vlan 99
  channel-group 30 mode active
  shutdown

ip as-path access-list AL-DC1-FABRIC seq 10 permit "_(65210|65211|65212|65213|65214|65215|65216)_"
route-map RM-LEGACY-IN deny 5         ! never take our own routes back from the core
  match as-path AL-DC1-FABRIC
route-map RM-LEGACY-IN permit 10      ! legacy subnets not yet migrated
  match ip address prefix-list PL-DC1-SITE
route-map RM-LEGACY-IN permit 20      ! legacy default until the firewall moves (M4)
  match ip address prefix-list PL-DEFAULT
  set local-preference 50
route-map RM-LEGACY-OUT permit 10
  match ip address prefix-list PL-DC1-SITE PL-DC2-SITE PL-DEFAULT

router bgp 65214
  vrf TRUST
    neighbor 10.110.244.73
      remote-as 65217
      description DC1-FW (active member) ethernet1/26
      bfd
      address-family ipv4 unicast
        route-map RM-FW-IN in
        route-map RM-FW-OUT out
        maximum-prefix 10
    neighbor <DC1-CORE-VLAN99-IP>
      remote-as 65218
      description Legacy core (migration only)
      shutdown
      address-family ipv4 unicast
        route-map RM-LEGACY-IN in
        route-map RM-LEGACY-OUT out
