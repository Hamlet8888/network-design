!==============================================================================
! DC2-NXBGW-01 · Multi-Site anycast BGW · BGP AS 65225 · N9K-C93180YC-FX3
! DC1-DC2 EVPN/VXLAN Multi-Site demo fabric (BGP only). Generated by fabric_design.
! FICTIONAL DEMO DATA: not for any real network.
! Template: validate against the exact Nexus model and NX-OS release before use.
! Fill in every <placeholder>. Host-gateway SVIs ship shut (migration step M3).
! Baseline included: AAA/TACACS+, NTP, syslog, SNMPv3, CoPP, SSH-only vty, banner.
!==============================================================================

hostname DC2-NXBGW-01

! ---- out-of-band management (10.120.245.0/24, gateway on the firewall) ---
vrf context management
  ip route 0.0.0.0/0 10.120.245.1
  ip name-server 10.250.0.53
  ip name-server 10.250.1.53
  ip domain-name dc.example.net
interface mgmt0
  vrf member management
  ip address 10.120.245.31/24

! ---- baseline: hardening -------------------------------------------
no feature telnet
feature ssh
password strength-check
copp profile strict

ip access-list ACL-VTY
  10 permit tcp 10.110.245.0/24 any eq 22
  20 permit tcp 10.120.245.0/24 any eq 22
  30 permit tcp 10.250.0.0/23 any eq 22
  1000 deny ip any any log
line console
  exec-timeout 10
line vty
  exec-timeout 10
  access-class ACL-VTY in

! ---- baseline: AAA (TACACS+, local fallback when no server answers) -----
feature tacacs+
tacacs-server host 10.250.0.49 key 7 <TACACS-KEY-TYPE7>
tacacs-server host 10.250.1.49 key 7 <TACACS-KEY-TYPE7>
aaa group server tacacs+ TACACS
  server 10.250.0.49
  server 10.250.1.49
  use-vrf management
  source-interface mgmt0
aaa authentication login default group TACACS
aaa authentication login console local
aaa authorization commands default group TACACS local
aaa accounting default group TACACS
aaa authentication login error-enable
username admin password 5 <LOCAL-ADMIN-HASH> role network-admin

! ---- baseline: time, logging, SNMPv3 ----------------------------------
clock timezone UTC 0 0
ntp server 10.250.0.123 use-vrf management prefer
ntp server 10.250.1.123 use-vrf management
ntp source-interface mgmt0

logging server 10.250.0.40 5 use-vrf management
logging source-interface mgmt0
logging timestamp milliseconds

snmp-server contact noc@example.net
snmp-server location DC2 Example colo, Example City B
snmp-server user nms-ro network-operator auth sha <SNMP-AUTH-KEY> priv aes-128 <SNMP-PRIV-KEY>
snmp-server host 10.250.0.162 traps version 3 priv nms-ro
snmp-server host 10.250.0.162 use-vrf management
snmp-server source-interface traps mgmt0
snmp-server enable traps bgp

banner motd ^
Authorized access only. Activity is logged and monitored.
Disconnect now if you are not an authorized user.
^

nv overlay evpn
feature bgp
feature bfd
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay

evpn multisite border-gateway 120
  delay-restore time 300

interface loopback0
  ip address 10.120.240.21/32
interface loopback1
  description VTEP
  ip address 10.120.241.21/32
interface loopback100
  description Multi-Site VIP (shared by both DC2 BGWs)
  ip address 10.120.241.200/32

interface Ethernet1/49
  description DC2-NXSP-01 Eth1/5
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.9/31
  evpn multisite fabric-tracking
  no shutdown
interface Ethernet1/50
  description DC2-NXSP-02 Eth1/5
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.41/31
  evpn multisite fabric-tracking
  no shutdown

interface Ethernet1/51
  description DCI carrier A to DC1-NXBGW-01
  no switchport
  mtu 9216                         ! set to the carrier's maximum if lower
  no ip redirects
  ip address 10.110.246.1/31
  evpn multisite dci-tracking
  no shutdown
interface Ethernet1/52
  description DCI carrier B to DC1-NXBGW-02
  no switchport
  mtu 9216                         ! set to the carrier's maximum if lower
  no ip redirects
  ip address 10.120.246.2/31
  evpn multisite dci-tracking
  no shutdown

! ---- day-one cloud handoff (VRF TRUST) --------------------------------
! Routed subinterfaces only: an anycast BGW takes no endpoints, access ports or BGW-local VLANs.
interface Ethernet1/1
  description AWS Direct Connect connection 1 (10G cross-connect)
  no switchport
  mtu 9216
  no shutdown

interface Ethernet1/1.<AWS-VIF-VLAN>
  description AWS Direct Connect private VIF (connection 1)
  encapsulation dot1q <AWS-VIF-VLAN>    ! VLAN set on the VIF / by the hosted provider
  mtu 1500                              ! 9001 if the VIF is created with jumbo frames
  vrf member TRUST
  no ip redirects
  ip address 10.120.244.1/30
  no shutdown

interface Ethernet1/2
  description Azure ExpressRoute primary link (10G cross-connect)
  no switchport
  mtu 9216
  no shutdown

interface Ethernet1/2.<ER-VLAN>
  description Azure ExpressRoute private peering (primary link)
  encapsulation dot1q <ER-VLAN>         ! VLAN ID configured on the ER private peering
  mtu 1500                              ! ExpressRoute MTU is 1500
  vrf member TRUST
  no ip redirects
  ip address 10.120.244.17/30
  no shutdown

vrf context TRUST
  vni 50010
  rd auto
  address-family ipv4 unicast
    route-target both 65000:50010
    route-target both 65000:50010 evpn
vlan 3910
  vn-segment 50010
interface Vlan3910
  no shutdown
  mtu 9216
  vrf member TRUST
  ip forward

interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  multisite border-gateway interface loopback100
  member vni 50010 associate-vrf

! ---- underlay filters: only BGW loopbacks cross the DCI ----------------
ip prefix-list PL-BGW-LOCAL seq 10 permit 10.120.240.21/32
ip prefix-list PL-BGW-LOCAL seq 20 permit 10.120.240.22/32
ip prefix-list PL-BGW-LOCAL seq 30 permit 10.120.241.21/32
ip prefix-list PL-BGW-LOCAL seq 40 permit 10.120.241.22/32
ip prefix-list PL-BGW-LOCAL seq 50 permit 10.120.241.200/32
ip prefix-list PL-BGW-REMOTE seq 10 permit 10.110.240.21/32
ip prefix-list PL-BGW-REMOTE seq 20 permit 10.110.240.22/32
ip prefix-list PL-BGW-REMOTE seq 30 permit 10.110.241.21/32
ip prefix-list PL-BGW-REMOTE seq 40 permit 10.110.241.22/32
ip prefix-list PL-BGW-REMOTE seq 50 permit 10.110.241.200/32
route-map RM-FABRIC-UL-OUT permit 10    ! into the local fabric: own BGW loopbacks only
  match ip address prefix-list PL-BGW-LOCAL
route-map RM-DCI-UL-OUT permit 10
  match ip address prefix-list PL-BGW-LOCAL
route-map RM-DCI-UL-IN permit 10
  match ip address prefix-list PL-BGW-REMOTE

! ---- overlay filters: what may cross the DCI ---------------------------
ip prefix-list PL-DC2-SITE seq 10 permit 10.120.0.0/16 le 32
ip prefix-list PL-DC1-SITE seq 10 permit 10.110.0.0/16 le 32
ip prefix-list PL-CLOUD-AWS seq 10 permit 10.200.0.0/16 le 24
ip prefix-list PL-CLOUD-AZURE seq 10 permit 10.210.0.0/16 le 24
ip prefix-list PL-TO-CLOUD seq 10 permit 10.120.0.0/16
ip prefix-list PL-TO-CLOUD-BACKUP seq 10 permit 10.110.0.0/16

route-map RM-DCI-EVPN-OUT permit 10     ! own site prefixes; never 0.0.0.0/0
  match ip address prefix-list PL-DC2-SITE
route-map RM-DCI-EVPN-OUT permit 20     ! cloud prefixes learned at this site (type-5)
  match ip address prefix-list PL-CLOUD-AWS PL-CLOUD-AZURE
route-map RM-DCI-EVPN-IN permit 10
  match ip address prefix-list PL-DC1-SITE
route-map RM-DCI-EVPN-IN permit 20
  match ip address prefix-list PL-CLOUD-AWS PL-CLOUD-AZURE

! ---- what may be exchanged with AWS / Azure ----------------------------
route-map RM-AWS-IN permit 10           ! approved VPC CIDRs only; no default, no on-prem prefixes
  match ip address prefix-list PL-CLOUD-AWS
route-map RM-AZURE-IN permit 10         ! approved VNet CIDRs only
  match ip address prefix-list PL-CLOUD-AZURE
route-map RM-TO-CLOUD permit 10         ! this site's /16, preferred
  match ip address prefix-list PL-TO-CLOUD
route-map RM-TO-CLOUD permit 20         ! the other site's /16 as backup over the DCI
  match ip address prefix-list PL-TO-CLOUD-BACKUP
  set as-path prepend 65225 65225 65225

router bgp 65225
  router-id 10.120.240.21
  bestpath as-path multipath-relax
  address-family ipv4 unicast
    network 10.120.240.21/32
    network 10.120.241.21/32
    network 10.120.241.200/32
    maximum-paths 4
  address-family l2vpn evpn
  ! local fabric: eBGP underlay on the links, eBGP EVPN to the spine loopbacks
  neighbor 10.120.242.8
    remote-as 65220
    description DC2-NXSP-01 underlay
    bfd
    address-family ipv4 unicast
      route-map RM-FABRIC-UL-OUT out
  neighbor 10.120.242.40
    remote-as 65220
    description DC2-NXSP-02 underlay
    bfd
    address-family ipv4 unicast
      route-map RM-FABRIC-UL-OUT out
  neighbor 10.120.240.1
    remote-as 65220
    description DC2-NXSP-01 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.120.240.2
    remote-as 65220
    description DC2-NXSP-02 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
  ! DCI underlay (carrier A)
  neighbor 10.110.246.0
    remote-as 65215
    description DC1-NXBGW-01 underlay (carrier A)
    bfd
    address-family ipv4 unicast
      route-map RM-DCI-UL-IN in
      route-map RM-DCI-UL-OUT out
  ! DCI underlay (carrier B)
  neighbor 10.120.246.3
    remote-as 65216
    description DC1-NXBGW-02 underlay (carrier B)
    bfd
    address-family ipv4 unicast
      route-map RM-DCI-UL-IN in
      route-map RM-DCI-UL-OUT out
  ! DCI overlay to both remote BGWs
  neighbor 10.110.240.21
    remote-as 65215
    description DC1-NXBGW-01 EVPN
    update-source loopback0
    ebgp-multihop 5
    peer-type fabric-external
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map RM-DCI-EVPN-IN in
      route-map RM-DCI-EVPN-OUT out
  neighbor 10.110.240.22
    remote-as 65216
    description DC1-NXBGW-02 EVPN
    update-source loopback0
    ebgp-multihop 5
    peer-type fabric-external
    address-family l2vpn evpn
      send-community
      send-community extended
      route-map RM-DCI-EVPN-IN in
      route-map RM-DCI-EVPN-OUT out
  ! cloud peerings: learned prefixes become type-5 routes in the local fabric and, through
  ! RM-DCI-EVPN-OUT, at the other site (which prefers its own cloud links: shorter AS path)
  vrf TRUST
    address-family ipv4 unicast
      aggregate-address 10.120.0.0/16
      aggregate-address 10.110.0.0/16
      maximum-paths 4
    neighbor 10.120.244.2
      remote-as 64512
      description AWS Direct Connect private VIF (connection 1)
      password <AWS-BGP-MD5-KEY>          ! from the vault, same key as on the VIF
      bfd
      address-family ipv4 unicast
        route-map RM-AWS-IN in
        route-map RM-TO-CLOUD out
        maximum-prefix 100 warning-only
    neighbor 10.120.244.18
      remote-as 12076
      description Azure ExpressRoute private peering (primary link)
      bfd
      address-family ipv4 unicast
        route-map RM-AZURE-IN in
        route-map RM-TO-CLOUD out
        maximum-prefix 100 warning-only
