!==============================================================================
! DC2-NXLF-02 · Leaf / VTEP · BGP AS 65222
! DC1-DC2 EVPN/VXLAN Multi-Site demo fabric (BGP only). Generated by fabric_design.
! FICTIONAL DEMO DATA: not for any real network.
! Template: validate against the exact Nexus model and NX-OS release before use.
! Fill in every <placeholder>. Host-gateway SVIs ship shut (migration step M4).
! Not included: AAA/TACACS, NTP, SNMP, syslog, banners, users. Apply your own baseline.
!==============================================================================

hostname DC2-NXLF-02

! ---- out-of-band management (10.120.245.0/24, gateway on the firewall) ---
vrf context management
  ip route 0.0.0.0/0 10.120.245.1
interface mgmt0
  vrf member management
  ip address 10.120.245.22/24

nv overlay evpn
feature bgp
feature bfd
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
feature vpc
feature lacp
fabric forwarding anycast-gateway-mac 2020.0000.00aa

! ---- underlay (eBGP, AS 65222) ---------------------------------------
interface loopback0
  description Router-ID / EVPN peering
  ip address 10.120.240.12/32

interface loopback1
  description VTEP (primary) + vPC anycast VTEP (secondary)
  ip address 10.120.241.12/32
  ip address 10.120.241.101/32 secondary

interface Ethernet1/49
  description DC2-NXSP-01 Eth1/2
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.3/31
  no shutdown

interface Ethernet1/50
  description DC2-NXSP-02 Eth1/2
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.120.242.35/31
  no shutdown

! ---- vPC ---------------------------------------------------------------
vrf context KEEPALIVE

interface Ethernet1/48
  description vPC keepalive to DC2-NXLF-01
  no switchport
  vrf member KEEPALIVE
  ip address 10.120.243.2/30
  no shutdown

spanning-tree vlan 1-3967 priority 8192

vpc domain 121
  peer-switch
  role priority 20
  peer-keepalive destination 10.120.243.1 source 10.120.243.2 vrf KEEPALIVE
  peer-gateway
  ip arp synchronize

interface port-channel10
  description vPC peer-link to DC2-NXLF-01
  switchport mode trunk
  spanning-tree port type network
  vpc peer-link

interface Ethernet1/53-54
  description vPC peer-link
  switchport mode trunk
  channel-group 10 mode active
  no shutdown

vlan 3900
  name VPC-BACKUP-UNDERLAY
system nve infra-vlans 3900

interface Vlan3900
  description vPC backup underlay to DC2-NXLF-01 (eBGP)
  no shutdown
  mtu 9216
  no ip redirects
  ip address 10.120.243.6/30

! ---- tenant VRF and L3VNI ---------------------------------------------
vrf context TRUST
  vni 50010
  rd auto
  address-family ipv4 unicast
    route-target both 65000:50010
    route-target both 65000:50010 evpn

vlan 3910
  name L3VNI-TRUST
  vn-segment 50010

interface Vlan3910
  description L3VNI TRUST
  no shutdown
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip forward

! ---- host VLANs: same VLAN ID, subnet and .1 gateway as today ----------
! Every routed VLAN from section 6.1. Prune to the VLANs whose hosts attach to this pair.

vlan 10
  name MGMT
  vn-segment 120010
vlan 20
  name SERVERS-20
  vn-segment 120020
vlan 30
  name APP-30
  vn-segment 120030
vlan 40
  name DB-40
  vn-segment 120040
vlan 100
  name STORAGE-100
  vn-segment 120100

interface Vlan10
  description MGMT (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (migration M4)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.120.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan20
  description SERVERS-20 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (migration M4)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.120.20.1/24
  fabric forwarding mode anycast-gateway

interface Vlan30
  description APP-30 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (migration M4)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.120.30.1/24
  fabric forwarding mode anycast-gateway

interface Vlan40
  description DB-40 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (migration M4)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.120.40.1/24
  fabric forwarding mode anycast-gateway

interface Vlan100
  description STORAGE-100 (anycast gateway)
  shutdown                        ! no shutdown at this VLAN's gateway cut-over (migration M4)
  mtu 9216
  vrf member TRUST
  no ip redirects
  ip address 10.120.100.1/24
  fabric forwarding mode anycast-gateway

! Explicit RTs: with a different ASN per leaf, 'auto' would give every leaf a different RT.
evpn
  vni 120010 l2
    rd auto
    route-target import 65120:120010
    route-target export 65120:120010
  vni 120020 l2
    rd auto
    route-target import 65120:120020
    route-target export 65120:120020
  vni 120030 l2
    rd auto
    route-target import 65120:120030
    route-target export 65120:120030
  vni 120040 l2
    rd auto
    route-target import 65120:120040
    route-target export 65120:120040
  vni 120100 l2
    rd auto
    route-target import 65120:120100
    route-target export 65120:120100

! ARP suppression needs TCAM space on -EX/-FX platforms first (then reload):
!   hardware access-list tcam region arp-ether 256 double-wide
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  advertise virtual-rmac
  global ingress-replication protocol bgp
  global suppress-arp
  member vni 50010 associate-vrf
  member vni 120010
  member vni 120020
  member vni 120030
  member vni 120040
  member vni 120100

! ---- BGP: underlay + overlay ------------------------------------------
ip prefix-list PL-DC2-SITE seq 10 permit 10.120.0.0/16 le 32
route-map RM-DIRECT permit 10
  match ip address prefix-list PL-DC2-SITE

router bgp 65222
  router-id 10.120.240.12
  bestpath as-path multipath-relax
  address-family ipv4 unicast
    network 10.120.240.12/32
    network 10.120.241.12/32
    network 10.120.241.101/32
    maximum-paths 4
  address-family l2vpn evpn
    advertise-pip
  neighbor 10.120.242.2
    remote-as 65220
    description DC2-NXSP-01 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.242.34
    remote-as 65220
    description DC2-NXSP-02 underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.243.5
    remote-as 65221
    description DC2-NXLF-01 vPC backup underlay
    bfd
    address-family ipv4 unicast
  neighbor 10.120.240.1
    remote-as 65220
    description DC2-NXSP-01 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 10.120.240.2
    remote-as 65220
    description DC2-NXSP-02 EVPN
    update-source loopback0
    ebgp-multihop 2
    address-family l2vpn evpn
      send-community
      send-community extended
  vrf TRUST
    address-family ipv4 unicast
      redistribute direct route-map RM-DIRECT
      maximum-paths 4
