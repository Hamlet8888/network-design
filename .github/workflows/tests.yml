name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and consistency tests
        run: python -m unittest discover -s tests -t . -v
      - name: Committed demo output is current
        run: |
          python -m fabric_design.build examples/demo-fabric.json --out examples/demo
          git diff --exit-code -- examples/demo
